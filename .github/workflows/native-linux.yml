name: Native Linux qualification

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-26-04-amd64:
    name: Ubuntu 26.04 amd64
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Ubuntu toolchain
        timeout-minutes: 8
        run: |
          archive=
          for mirror in https://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu; do
            if curl --fail --silent --show-error --location --connect-timeout 8 --max-time 20 \
              --output /dev/null "$mirror/dists/resolute/InRelease"; then
              archive=$mirror
              break
            fi
          done
          test -n "$archive"
          sources="$RUNNER_TEMP/native-linux-ubuntu.sources"
          cat > "$sources" <<EOF
          Types: deb
          URIs: $archive
          Suites: resolute resolute-updates resolute-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          apt_options=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install --yes --no-install-recommends ipe lua5.4 texlive-latex-base poppler-utils mupdf-tools bubblewrap util-linux
          apt-cache "${apt_options[@]}" policy ipe lua5.4 texlive-latex-base poppler-utils mupdf-tools bubblewrap util-linux

      - name: Install locked JavaScript dependencies
        timeout-minutes: 5
        run: |
          npm install --global npm@11.16.0 --fetch-retries=2 --fetch-timeout=30000
          npm ci --ignore-scripts --no-audit --no-fund --fetch-retries=2 --fetch-timeout=30000

      - name: Verify runner and record toolchain provenance
        shell: bash
        run: |
          source /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]
          [[ "$(uname -m)" == x86_64 && "$(dpkg --print-architecture)" == amd64 ]]
          kernel=$(uname -r)
          [[ "${kernel,,}" != *microsoft* && -z "${WSL_INTEROP:-}" && ! -e /proc/sys/fs/binfmt_misc/WSLInterop ]]
          [[ "$(systemd-detect-virt --container || true)" == none ]]
          printf 'Runner image: %s %s\nKernel: %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$kernel"
          node --version
          npm --version
          dpkg-query -S /usr/bin/prlimit
          bash scripts/gates/check-m9-setup.sh

      - name: Check fail-closed native process attestation
        run: |
          /usr/bin/bwrap --unshare-user --ro-bind / / --ro-bind /dev/null /var/lib/dpkg/info/bubblewrap.list --chdir "$PWD" "$(command -v node)" --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { NATIVE_PROCESS_LIMITS } from "./dist/src/limits.js";
          import { runControlledProcess } from "./dist/src/native/process.js";

          await assert.rejects(
            runControlledProcess("/usr/bin/true", [], process.cwd(), NATIVE_PROCESS_LIMITS, "NATIVE_RENDER_ERROR"),
            { code: "NATIVE_UNAVAILABLE" },
          );
          console.log("Missing Bubblewrap ownership evidence rejected before spawn");
          NODE

      - name: Run complete test suite
        run: npm test

      - name: Check baseline, hostile inputs and real documents
        run: |
          bash scripts/gates/check-m8.sh
          export IPE_M9_INHERITED_M8_TREE
          IPE_M9_INHERITED_M8_TREE=$(git write-tree)
          bash scripts/gates/check-m9-limits.sh
          bash scripts/gates/check-m9-hostile.sh
          bash scripts/gates/check-m9-real.sh

      - name: Verify installed package and portable MCP scenario
        run: |
          bash scripts/gates/check-mcp-harness-policy.sh
          npm run check:m10:package
